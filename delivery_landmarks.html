<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saleko Admin • Landmarks</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen flex">
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col"></aside>
    <main class="flex-1 min-w-0">
      <header id="topbar" class="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-slate-200"></header>
      <div id="content" class="px-4 md:px-8 py-6 space-y-6">
        <div id="dupes"></div>

        <section class="bg-white border border-slate-200 rounded-2xl">
          <div class="p-5 border-b border-slate-200 flex items-center gap-2 flex-wrap">
            <input id="q" placeholder="Search landmark" class="rounded-xl border border-slate-200 px-3 py-2 text-sm w-56">
            <select id="fLga" class="rounded-xl border border-slate-200 px-3 py-2 text-sm bg-white"><option value="">All LGAs</option></select>
            <select id="fZone" class="rounded-xl border border-slate-200 px-3 py-2 text-sm bg-white"><option value="">All zones</option></select>
            <select id="fConf" class="rounded-xl border border-slate-200 px-3 py-2 text-sm bg-white"><option value="">Any confidence</option><option>High</option><option>Medium</option><option>Low</option></select>
            <label class="flex items-center gap-2 text-sm text-slate-600"><input id="fOver" type="checkbox" class="h-4 w-4 rounded"> Overridden only</label>
            <div class="ml-auto flex gap-2">
              <button id="btnExport" data-perm="delivery.landmarks.import" class="rounded-lg border border-slate-200 px-3 py-2 text-sm hover:bg-slate-50">Export CSV</button>
              <label data-perm="delivery.landmarks.import" class="rounded-lg border border-slate-200 px-3 py-2 text-sm hover:bg-slate-50 cursor-pointer">Import CSV<input id="fileImport" type="file" accept=".csv" class="hidden"></label>
              <button id="btnAdd" data-perm="delivery.landmarks.edit" class="rounded-lg bg-emerald-700 text-white px-3 py-2 text-sm hover:bg-emerald-800">Add landmark</button>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-[1150px] w-full text-sm">
              <thead class="bg-slate-50 text-slate-500">
                <tr><th class="p-3 text-left">Landmark</th><th class="p-3 text-left">LGA</th><th class="p-3 text-right">Distance (km)</th><th class="p-3 text-left">Zone (auto)</th><th class="p-3 text-left">Zone override</th><th class="p-3 text-left">Final zone</th><th class="p-3 text-left">Confidence</th><th class="p-3 text-left">Note</th><th class="p-3 text-left">Status</th><th class="p-3"></th></tr>
              </thead>
              <tbody id="rows" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
          <div class="p-4 border-t border-slate-200 flex items-center gap-2 text-sm text-slate-500">
            <span id="count"></span>
            <div class="ml-auto flex gap-2"><button id="prev" class="rounded-lg border border-slate-200 px-3 py-1.5 hover:bg-slate-50">Prev</button><button id="next" class="rounded-lg border border-slate-200 px-3 py-1.5 hover:bg-slate-50">Next</button></div>
          </div>
        </section>
      </div>
    </main>
  </div>

<script src="delivery_seed.js"></script>
<script src="delivery_core.js"></script>
<script>
  const { esc } = DL;
  const ok = DL.mount({ active: "delivery_landmarks.html", title: "Landmarks", subtitle: "Delivery → Landmarks · measured from 27 Ribadu Road, Ikoyi", needs: "delivery.view" });
  const PAGE = 40; let page = 0;
  const CONF = { High: "bg-emerald-50 text-emerald-700 border-emerald-200", Medium: "bg-amber-50 text-amber-800 border-amber-200", Low: "bg-rose-50 text-rose-700 border-rose-200" };
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
  // Flag near-duplicates in the same LGA (one name contains the other), e.g. Ojuelegba / Ojuelegba Roundabout.
  function nearDupes(lga, name, exceptId) {
    const n = norm(name);
    return DL.S.landmarks.filter((l) => l.id !== exceptId && l.lga === lga && n && (norm(l.name).includes(n) || n.includes(norm(l.name))));
  }

  const params = new URLSearchParams(location.search);
  function initFilters() {
    const S = DL.S;
    document.getElementById("fLga").innerHTML += S.lgas.map((l) => `<option>${esc(l.name)}</option>`).join("");
    document.getElementById("fZone").innerHTML += DL.ALL_ZONES.map((z) => `<option value="${z}">Zone ${z}</option>`).join("");
    if (params.get("lga")) document.getElementById("fLga").value = params.get("lga");
    ["q", "fLga", "fZone", "fConf", "fOver"].forEach((id) => document.getElementById(id).addEventListener("input", () => { page = 0; render(); }));
  }

  function filtered() {
    const q = document.getElementById("q").value.trim().toLowerCase(), lga = document.getElementById("fLga").value, z = Number(document.getElementById("fZone").value), c = document.getElementById("fConf").value, ov = document.getElementById("fOver").checked;
    return DL.S.landmarks.filter((l) => (!q || l.name.toLowerCase().includes(q)) && (!lga || l.lga === lga) && (!z || DL.finalZone(l) === z) && (!c || l.confidence === c) && (!ov || l.override));
  }

  function render() {
    const S = DL.S;
    const pairs = [];
    S.landmarks.forEach((l) => nearDupes(l.lga, l.name, l.id).forEach((o) => { if (l.id < o.id && !pairs.some((p) => p[0].id === o.id && p[1].id === l.id)) pairs.push([l, o]); }));
    document.getElementById("dupes").innerHTML = pairs.length ? `<div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-sm text-amber-900"><b>${pairs.length} possible duplicate${pairs.length > 1 ? "s" : ""}</b> in the same LGA: ${pairs.map(([a, b]) => `${esc(a.name)} / ${esc(b.name)} (${esc(a.lga)})`).join(" · ")}. Deactivate one of each pair so customers don't see both.</div>` : "";
    const list = filtered(), pages = Math.max(1, Math.ceil(list.length / PAGE));
    page = Math.min(page, pages - 1);
    document.getElementById("rows").innerHTML = list.slice(page * PAGE, page * PAGE + PAGE).map((l) => {
      const auto = DL.autoZone(l), fin = DL.finalZone(l);
      return `<tr class="${l.status === "active" ? "" : "text-slate-400 bg-slate-50"}">
        <td class="p-3 font-medium">${esc(l.name)}${l.ogun ? ' <span class="ml-1 text-xs rounded bg-indigo-50 text-indigo-700 px-1.5 py-0.5">Ogun State</span>' : ""}</td>
        <td class="p-3 whitespace-nowrap">${esc(l.lga)}</td>
        <td class="p-3 text-right tabular-nums">${l.km.toFixed(1)}</td>
        <td class="p-3 whitespace-nowrap text-slate-500">Zone ${auto}</td>
        <td class="p-3">${l.override ? `<span class="rounded-full bg-violet-50 text-violet-700 border border-violet-200 px-2 py-0.5 text-xs" title="${esc(l.overrideReason)}">Overridden → Zone ${l.override}</span>` : '<span class="text-slate-300">—</span>'}</td>
        <td class="p-3 font-semibold whitespace-nowrap">Zone ${fin}</td>
        <td class="p-3"><span class="rounded-full border px-2 py-0.5 text-xs ${CONF[l.confidence]}">${l.confidence}</span></td>
        <td class="p-3 text-xs text-slate-500 max-w-[280px]">${esc(l.note)}</td>
        <td class="p-3">${l.status === "active" ? "Active" : "Inactive"}</td>
        <td class="p-3 text-right"><button data-edit="${l.id}" data-perm="delivery.landmarks.edit" class="rounded-lg border border-slate-200 px-3 py-1.5 hover:bg-slate-50">Edit</button></td></tr>`;
    }).join("") || `<tr><td colspan="10" class="p-10 text-center text-slate-500">No landmarks match these filters.</td></tr>`;
    document.getElementById("count").textContent = `${list.length} landmark${list.length === 1 ? "" : "s"} · page ${page + 1} of ${pages}`;
    document.getElementById("prev").disabled = page === 0; document.getElementById("next").disabled = page >= pages - 1;
    DL.applyPerms();
    document.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => edit(b.dataset.edit));
  }

  function edit(id) {
    const S = DL.S, l = id ? S.landmarks.find((x) => x.id === id) : { name: "", lga: document.getElementById("fLga").value || S.lgas[0].name, km: 10, confidence: "Medium", note: "", override: null, overrideReason: "", ogun: false, status: "active" };
    const loadedV = l.v || 1;
    const d = DL.openDrawer(DL.drawerFrame(id ? `Edit ${esc(l.name)}` : "Add landmark", id ? esc(l.lga) : "New landmark", `
      <label class="block text-sm"><span class="text-slate-600">Name</span><input id="fName" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2" value="${esc(l.name)}"><div id="eName" class="text-xs mt-1"></div></label>
      <label class="block text-sm"><span class="text-slate-600">LGA</span><select id="fL" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 bg-white">${S.lgas.map((x) => `<option ${x.name === l.lga ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
      <div class="grid grid-cols-2 gap-3">
        <label class="block text-sm"><span class="text-slate-600">Distance from origin (km)</span><input id="fKm" type="number" step="0.1" min="0" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2" value="${l.km}"><div id="eKm" class="text-xs text-rose-600 mt-1"></div></label>
        <label class="block text-sm"><span class="text-slate-600">Confidence</span><select id="fC" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 bg-white">${["High", "Medium", "Low"].map((c) => `<option ${c === l.confidence ? "selected" : ""}>${c}</option>`).join("")}</select></label>
      </div>
      <label class="flex items-center gap-2 text-sm"><input id="fOgun" type="checkbox" class="h-4 w-4 rounded" ${l.ogun ? "checked" : ""}> In Ogun State <span class="text-slate-400">(forces Zone 7, partner delivery)</span></label>
      <div class="rounded-xl border border-slate-200 p-3 space-y-3">
        <div class="text-sm">Zone from distance: <b id="autoZ"></b></div>
        <label class="block text-sm"><span class="text-slate-600">Zone override</span><select id="fOv" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 bg-white"><option value="">No override</option>${DL.ALL_ZONES.map((z) => `<option value="${z}" ${l.override === z ? "selected" : ""}>Zone ${z}</option>`).join("")}</select></label>
        <label id="reasonWrap" class="block text-sm"><span class="text-slate-600">Override reason <span class="text-rose-600">*</span></span><input id="fOvR" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2" value="${esc(l.overrideReason)}" placeholder="e.g. Bridge closure makes this a long-haul route"><div id="eOvR" class="text-xs text-rose-600 mt-1"></div></label>
        <div class="text-sm rounded-lg bg-emerald-50 text-emerald-900 px-3 py-2">Final zone: <b id="finZ"></b></div>
      </div>
      <label class="block text-sm"><span class="text-slate-600">Note</span><textarea id="fNote" rows="2" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2">${esc(l.note)}</textarea></label>
      <label class="block text-sm"><span class="text-slate-600">Status</span><select id="fSt" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 bg-white"><option value="active">Active</option><option value="inactive">Inactive</option></select></label>`,
      `<button data-close-drawer class="rounded-lg border border-slate-200 px-3 py-2 text-sm bg-white hover:bg-slate-50">Cancel</button><button id="sv" class="rounded-lg bg-emerald-700 text-white px-3 py-2 text-sm hover:bg-emerald-800">${id ? "Save" : "Add landmark"}</button>`));
    d.querySelector("#fSt").value = l.status;
    const $ = (s) => d.querySelector(s);
    function live() {
      const km = Number($("#fKm").value), ogun = $("#fOgun").checked, ov = Number($("#fOv").value) || null;
      const auto = ogun ? 7 : DL.zoneFromKm(km);
      $("#autoZ").textContent = `Zone ${auto}${ogun ? " (Ogun State)" : ""}`;
      $("#finZ").innerHTML = `Zone ${ov || auto}${ov ? ' <span class="text-xs rounded bg-violet-100 text-violet-700 px-1.5">Overridden</span>' : ""}`;
      $("#reasonWrap").classList.toggle("hidden", !ov);
      const dn = nearDupes($("#fL").value, $("#fName").value.trim(), id);
      const exact = dn.find((x) => norm(x.name) === norm($("#fName").value.trim()));
      $("#eName").className = "text-xs mt-1 " + (exact ? "text-rose-600" : "text-amber-700");
      $("#eName").textContent = exact ? `“${exact.name}” already exists in ${exact.lga}.` : dn.length ? `Possible duplicate of ${dn.map((x) => "“" + x.name + "”").join(", ")} in this LGA.` : "";
    }
    ["#fKm", "#fOgun", "#fOv", "#fName", "#fL"].forEach((s) => $(s).addEventListener("input", live)); live();
    $("#sv").onclick = () => {
      const name = $("#fName").value.trim(), km = Math.round(Number($("#fKm").value) * 10) / 10, ov = Number($("#fOv").value) || null, reason = $("#fOvR").value.trim();
      if (!name) return ($("#eName").textContent = "Name is required.");
      if (S.landmarks.some((x) => x.id !== id && x.lga === $("#fL").value && norm(x.name) === norm(name))) return;
      if (!(km >= 0) || $("#fKm").value === "") return ($("#eKm").textContent = "Enter a distance in km.");
      if (ov && !reason) return ($("#eOvR").textContent = "A reason is required for an override.");
      if (id && DL.staleCheck(l, loadedV)) return;
      const next = { name, lga: $("#fL").value, km, confidence: $("#fC").value, ogun: $("#fOgun").checked, override: ov, overrideReason: ov ? reason : "", note: $("#fNote").value.trim(), status: $("#fSt").value };
      if (!id) { const nl = { id: DL.uid("lm"), workbookZone: "", v: 1, ...next }; S.landmarks.push(nl); DL.log("Landmarks", `${name} (${next.lga})`, "Created", "—", `${km} km → Zone ${DL.finalZone(nl)}`, reason); }
      else {
        const before = DL.finalZone(l);
        Object.entries(next).forEach(([k, v]) => { if (v !== l[k]) DL.log("Landmarks", `${l.name} (${l.lga})`, k === "override" ? "Zone override" : k, l[k] ?? "—", v ?? "—", k === "override" ? reason : ""); });
        Object.assign(l, next); l.v = loadedV + 1; l.updatedBy = DL.me().name; l.updatedAt = new Date().toISOString();
        if (DL.finalZone(l) !== before) DL.log("Landmarks", `${l.name} (${l.lga})`, "Final zone", "Zone " + before, "Zone " + DL.finalZone(l), reason);
      }
      if (DL.trySave(id ? `${name} updated` : `${name} added`)) { DL.closeDrawer(); render(); }
    };
  }

  // ---------- CSV ----------
  const HEAD = ["LGA", "Landmark", "Distance km", "Confidence", "Note", "Zone override", "Override reason", "Ogun State", "Status"];
  function exportCsv() {
    DL.csvDownload("saleko_landmarks.csv", [HEAD.concat(["Final zone"]), ...DL.S.landmarks.map((l) => [l.lga, l.name, l.km, l.confidence, l.note, l.override || "", l.overrideReason, l.ogun ? "Yes" : "No", l.status, DL.finalZone(l)])]);
    DL.log("Landmarks", "All landmarks", "Exported CSV", "—", DL.S.landmarks.length + " rows", "");
    DL.save();
  }
  function importCsv(text) {
    const S = DL.S, rows = DL.parseCsv(text);
    const head = rows.shift().map((h) => h.trim());
    const ix = (h) => head.indexOf(h);
    const missing = ["LGA", "Landmark", "Distance km"].filter((h) => ix(h) < 0);
    if (missing.length) return DL.toast("Missing columns: " + missing.join(", "), "error");
    const res = { add: [], change: [], same: 0, errors: [] };
    rows.forEach((r, i) => {
      const line = i + 2, g = (h) => (ix(h) >= 0 ? (r[ix(h)] || "").trim() : "");
      const lga = g("LGA"), name = g("Landmark"), km = Number(g("Distance km")), conf = g("Confidence") || "Medium", ov = g("Zone override") ? Number(g("Zone override")) : null;
      if (!S.lgas.some((x) => x.name === lga)) return res.errors.push(`Row ${line}: unknown LGA “${lga}”`);
      if (!name) return res.errors.push(`Row ${line}: landmark name is empty`);
      if (!Number.isFinite(km) || km < 0 || g("Distance km") === "") return res.errors.push(`Row ${line}: distance “${g("Distance km")}” isn't a number`);
      if (!["High", "Medium", "Low"].includes(conf)) return res.errors.push(`Row ${line}: confidence must be High, Medium or Low`);
      if (ov && !(ov >= 1 && ov <= 7)) return res.errors.push(`Row ${line}: zone override must be 1–7`);
      if (ov && !g("Override reason")) return res.errors.push(`Row ${line}: override needs a reason`);
      const rec = { lga, name, km: Math.round(km * 10) / 10, confidence: conf, note: g("Note"), override: ov, overrideReason: g("Override reason"), ogun: /^y/i.test(g("Ogun State")), status: /^inactive$/i.test(g("Status")) ? "inactive" : "active" };
      const ex = S.landmarks.find((x) => x.lga === lga && norm(x.name) === norm(name));
      if (!ex) return res.add.push(rec);
      const diffs = ["km", "confidence", "note", "override", "overrideReason", "ogun", "status"].filter((k) => (ex[k] ?? "") !== (rec[k] ?? ""));
      diffs.length ? res.change.push({ ex, rec, diffs }) : res.same++;
    });
    const d = DL.openDrawer(DL.drawerFrame("Import preview", `${rows.length} rows · nothing changes until you apply`, `
      <div class="grid grid-cols-4 gap-2 text-center text-sm">
        ${[["New", res.add.length, "emerald"], ["Changed", res.change.length, "sky"], ["Unchanged", res.same, "slate"], ["Errors", res.errors.length, "rose"]].map(([k, v, c]) => `<div class="rounded-xl border border-${c}-200 bg-${c}-50 p-2"><div class="text-xs text-${c}-700">${k}</div><div class="text-xl font-semibold">${v}</div></div>`).join("")}
      </div>
      ${res.errors.length ? `<div><div class="font-medium text-sm text-rose-700">Errors (these rows are skipped)</div><ul class="mt-1 text-sm text-rose-700 list-disc ml-5">${res.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
      ${res.add.length ? `<div><div class="font-medium text-sm">New</div><ul class="mt-1 text-sm text-slate-600 list-disc ml-5">${res.add.map((a) => `<li>${esc(a.name)} (${esc(a.lga)}) · ${a.km} km → Zone ${a.override || (a.ogun ? 7 : DL.zoneFromKm(a.km))}</li>`).join("")}</ul></div>` : ""}
      ${res.change.length ? `<div><div class="font-medium text-sm">Changed</div><ul class="mt-1 text-sm text-slate-600 list-disc ml-5">${res.change.map((c) => `<li>${esc(c.ex.name)}: ${c.diffs.map((k) => `${k} ${esc(c.ex[k] ?? "—")} → <b>${esc(c.rec[k] ?? "—")}</b>`).join(", ")}</li>`).join("")}</ul></div>` : ""}`,
      `<button data-close-drawer class="rounded-lg border border-slate-200 px-3 py-2 text-sm bg-white hover:bg-slate-50">Cancel</button><button id="apply" class="rounded-lg bg-emerald-700 text-white px-3 py-2 text-sm hover:bg-emerald-800" ${res.add.length + res.change.length ? "" : "disabled"}>Apply ${res.add.length + res.change.length} change(s)</button>`));
    d.querySelector("#apply").onclick = () => {
      res.add.forEach((a) => S.landmarks.push({ id: DL.uid("lm"), workbookZone: "", v: 1, ...a }));
      res.change.forEach((c) => { Object.assign(c.ex, c.rec); c.ex.v = (c.ex.v || 1) + 1; });
      DL.log("Landmarks", "CSV import", "Imported", "—", `${res.add.length} new, ${res.change.length} changed, ${res.errors.length} errors skipped`, "");
      if (DL.trySave("Import applied")) { DL.closeDrawer(); render(); }
    };
  }

  document.getElementById("btnAdd").onclick = () => edit(null);
  document.getElementById("btnExport").onclick = exportCsv;
  document.getElementById("fileImport").onchange = (e) => { const f = e.target.files[0]; if (f) f.text().then(importCsv); e.target.value = ""; };
  document.getElementById("prev").onclick = () => { page--; render(); };
  document.getElementById("next").onclick = () => { page++; render(); };
  if (ok) { initFilters(); DL.skeleton(document.getElementById("rows"), 6, 10); setTimeout(render, 250); document.addEventListener("dl:external-change", render); }
</script>
</body>
</html>
